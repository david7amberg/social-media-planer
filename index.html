<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Social-Media-Planer</title>
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121418" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Planer">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<style>
:root{
  --bg:#f4f5f7; --surface:#ffffff; --surface2:#eceef2; --line:#dde1e6; --text:#1b1f24; --muted:#5f6875;
  --accent:#1f6feb; --accent-ink:#ffffff;
  --red:#cf222e; --red-bg:#fde7e9; --amber:#b26b00; --amber-bg:#fff2d6; --green:#1a7f37;
  --shadow:0 12px 40px rgba(15,20,30,.18); --radius:10px; --top:54px;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#121418; --surface:#1b1e23; --surface2:#262a31; --line:#343941; --text:#e7e9ec; --muted:#9aa3ae;
  --accent:#4d94ff; --accent-ink:#0b1220;
  --red:#ff6b6b; --red-bg:#3b1e22; --amber:#f2b33d; --amber-bg:#3a2d14; --green:#4ac26b;
  --shadow:0 12px 40px rgba(0,0,0,.5); color-scheme:dark;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121418; --surface:#1b1e23; --surface2:#262a31; --line:#343941; --text:#e7e9ec; --muted:#9aa3ae;
    --accent:#4d94ff; --accent-ink:#0b1220;
    --red:#ff6b6b; --red-bg:#3b1e22; --amber:#f2b33d; --amber-bg:#3a2d14; --green:#4ac26b;
    --shadow:0 12px 40px rgba(0,0,0,.5); color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{font:14px/1.42 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{margin:0;font-weight:650;letter-spacing:-.01em}
.muted{color:var(--muted)} .small{font-size:12px}
[hidden]{display:none!important}

/* ---------- Kopfzeile */
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;padding:9px 16px;padding-top:max(9px,env(safe-area-inset-top));padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right));background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:saturate(1.5) blur(14px);backdrop-filter:saturate(1.5) blur(14px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;font-weight:650;white-space:nowrap;margin-right:6px}
.brand svg{width:22px;height:22px;flex:none}
.tabs{display:flex;background:var(--surface2);border-radius:9px;padding:2px;gap:2px}
.tabs button{border:0;background:transparent;padding:5px 13px;border-radius:7px;color:var(--muted);font-weight:500}
.tabs button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.14)}
.spacer{flex:1}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:6px 12px;border-radius:8px;font-weight:500;white-space:nowrap;line-height:1.3}
.btn:hover{border-color:color-mix(in srgb,var(--text) 25%,var(--line))}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .btn.primary{color:var(--accent-ink)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{color:var(--accent-ink)}}
.btn.danger{color:var(--red)}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn.block{width:100%;justify-content:center}
.btn:disabled{opacity:.45;cursor:default}
.iconbtn{display:inline-grid;place-items:center;width:32px;height:32px;border:0;background:transparent;border-radius:8px;color:var(--muted);flex:none}
.iconbtn:hover{background:var(--surface2);color:var(--text)}
.iconbtn svg{width:18px;height:18px}
.iconbtn.sm{width:26px;height:26px}
.iconbtn.sm svg{width:15px;height:15px}
.linkbtn{border:0;background:none;padding:0;color:var(--accent);font-weight:500}
.linkbtn:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- Grundlayout */
.layout{display:grid;grid-template-columns:268px minmax(0,1fr);align-items:start}
aside{position:sticky;top:var(--top);height:calc(100vh - var(--top));overflow:auto;border-right:1px solid var(--line);padding:16px 16px 40px;padding-left:max(16px,env(safe-area-inset-left))}
aside section{margin-bottom:22px}
aside h3{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:8px;font-weight:650}
.sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.sh h3{margin:0}
main{padding:16px 22px 60px;min-width:0;padding-right:max(22px,env(safe-area-inset-right))}
.scrim{display:none}

/* ---------- Seitenleiste */
.proj{display:flex;align-items:center;gap:6px;padding:5px 4px 5px 2px;border-radius:8px}
.proj:hover{background:var(--surface2)}
.pchk{display:flex;align-items:center;gap:8px;flex:1;min-width:0;cursor:pointer}
.pchk input{width:16px;height:16px;margin:0;flex:none}
.ptxt{display:flex;flex-direction:column;min-width:0}
.pname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.psub{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted)}
.pk{font-size:11px;font-weight:650;color:var(--muted);background:var(--surface2);border-radius:4px;padding:1px 5px}
.pcount{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.chk{display:flex;align-items:center;gap:8px;padding:3px 0;cursor:pointer}
.chk input{margin:0}
.legend{display:grid;grid-template-columns:auto 1fr;gap:5px 9px;align-items:center;font-size:12.5px}
.legend .si{--pc:var(--muted)}
.lg-ring{width:22px;height:13px;border-radius:4px;background:var(--surface2)}
.lg-ring.r{box-shadow:inset 0 0 0 1.5px var(--red)} .lg-ring.a{box-shadow:inset 0 0 0 1.5px var(--amber)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.datainfo{font-size:12px;color:var(--muted);margin:0 0 8px}

/* ---------- Banner */
.banner{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:9px 12px;border-radius:9px;margin-bottom:12px;font-size:13px}
.banner.red{background:var(--red-bg);color:var(--text);border:1px solid color-mix(in srgb,var(--red) 40%,transparent)}
.banner.amber{background:var(--amber-bg);border:1px solid color-mix(in srgb,var(--amber) 40%,transparent)}
.banner .spacer{min-width:8px}

/* ---------- Ansichts-Leiste */
.vbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px;min-height:34px}
.vtitle{font-size:20px}
.navgrp{display:flex;align-items:center;gap:2px}
.vhint{font-size:12px;color:var(--muted);margin-left:auto}

/* ---------- Status-Icons und Chips */
.si{width:14px;height:14px;flex:none;display:block}
.si .o{fill:none;stroke:var(--pc);stroke-width:1.5}
.si .f{fill:var(--pc);stroke:var(--pc);stroke-width:1.5}
.si .h{fill:var(--pc)}
.si .ck{fill:none;stroke:var(--surface);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.st{display:inline-grid;place-items:center;border-radius:5px;cursor:pointer;flex:none}
.st:hover{background:color-mix(in srgb,var(--pc) 22%,transparent)}
.chip{--pc:#888;display:flex;align-items:center;gap:4px;min-width:0;margin-top:3px;padding:2px 6px 2px 4px;border-radius:5px;background:color-mix(in srgb,var(--pc) 15%,var(--surface));border-left:3px solid var(--pc);font-size:12px;line-height:1.35;cursor:pointer;-webkit-user-select:none;user-select:none}
.chip:hover{background:color-mix(in srgb,var(--pc) 24%,var(--surface))}
.chip .lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.month .chip{align-items:flex-start}
.month .chip .si{margin-top:2px}
.month .chip .lbl{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word}
.chip .time{font-variant-numeric:tabular-nums;color:var(--muted);font-size:11.5px}
.chip.done{opacity:.55}
.chip.removed .lbl,.row.removed .rlbl{text-decoration:line-through}
.w-overdue{box-shadow:inset 0 0 0 1.5px var(--red)}
.w-warn{box-shadow:inset 0 0 0 1.5px var(--amber)}
.chip .flag{color:var(--red);font-weight:800;font-size:11px;padding:0 1px}
.chip.dragging{opacity:.4}
.pb{display:inline-block;font-size:9.5px;font-weight:700;letter-spacing:.02em;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 3px;line-height:1.45;background:var(--surface)}
.badges{display:inline-flex;gap:3px;flex:none}

/* ---------- Monat */
.month{display:grid;grid-template-columns:30px repeat(7,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.month .wd{background:var(--surface2);padding:6px 8px;font-size:12px;color:var(--muted);font-weight:600}
.month .kw{background:var(--surface2);font-size:10.5px;color:var(--muted);padding:8px 0;text-align:center;font-variant-numeric:tabular-nums}
.day{background:var(--surface);min-height:124px;padding:5px 5px 7px;min-width:0}
.day.wkend{background:color-mix(in srgb,var(--surface) 82%,var(--surface2))}
.day.out{background:color-mix(in srgb,var(--surface) 45%,var(--bg))}
.day.out .dnum{color:var(--muted)}
.dhead{display:flex;align-items:center;gap:6px;min-height:22px}
.dnum{font-size:12.5px;font-weight:600;min-width:22px;height:22px;display:inline-grid;place-items:center;border-radius:999px;font-variant-numeric:tabular-nums}
.day.today .dnum{background:var(--accent);color:#fff}
.hol{flex:1;min-width:0;font-size:10.5px;color:var(--muted);font-style:italic;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.day .add{margin-left:auto;opacity:0;width:22px;height:22px}
.day:hover .add,.wcol:hover .add{opacity:1}
.drop-over{outline:2px dashed var(--accent);outline-offset:-3px}
.more{display:block;border:0;background:none;padding:3px 4px 0;font-size:11.5px;color:var(--muted);font-weight:500}
.more:hover{color:var(--text)}

/* ---------- Woche */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.wcol{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);min-height:62vh;padding:6px;min-width:0}
.wcol.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.wcol.wkend{background:color-mix(in srgb,var(--surface) 82%,var(--surface2))}
.whead{display:flex;align-items:center;gap:6px;padding:2px 2px 6px;border-bottom:1px solid var(--line);margin-bottom:4px}
.whead .wdn{font-size:12px;color:var(--muted);font-weight:600}
.whead .dnum{font-size:15px}
.wcol.today .dnum{background:var(--accent);color:#fff}
.whol{font-size:10.5px;color:var(--muted);font-style:italic;padding:0 2px 4px}
.card{flex-direction:column;align-items:stretch;gap:3px;padding:5px 6px 6px 6px;margin-top:6px}
.card .l1{display:flex;align-items:flex-start;gap:5px}
.card .l1 .si{margin-top:2px}
.card .lbl{white-space:normal;overflow:visible;font-weight:500;line-height:1.3}
.card .l2{display:flex;align-items:center;gap:4px;flex-wrap:wrap;padding-left:19px;color:var(--muted);font-size:11px}
.wempty{font-size:12px;color:var(--muted);padding:8px 4px}

/* ---------- Liste und Heute */
.group{margin-bottom:16px}
.ghead{display:flex;align-items:baseline;gap:8px;font-weight:650;font-size:13px;padding:6px 2px;position:sticky;top:var(--top);background:var(--bg);z-index:2}
.ghead .muted{font-weight:500}
.mhead{font-size:17px;margin:22px 0 6px}
.rows{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.row{--pc:#888;display:flex;align-items:center;gap:9px;padding:8px 12px 8px 8px;border-top:1px solid var(--line);cursor:pointer;min-width:0}
.row:first-child{border-top:0}
.row:hover{background:color-mix(in srgb,var(--pc) 7%,var(--surface))}
.row .st{width:24px;height:24px}
.row .bar{width:4px;align-self:stretch;border-radius:3px;background:var(--pc);flex:none}
.rdate{width:74px;flex:none;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.rtime{width:38px;flex:none;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.rlbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rmeta{display:flex;align-items:center;gap:6px;flex:none;color:var(--muted);font-size:12px}
.rstatus{width:68px;flex:none;font-size:12px;color:var(--muted)}
.row.done .rlbl,.row.done .rtime{opacity:.55}
.tag{display:inline-block;font-size:11px;font-weight:600;border-radius:999px;padding:1px 7px;background:var(--surface2);color:var(--muted);white-space:nowrap;flex:none}
.tag.red{background:var(--red-bg);color:var(--red)}
.tag.amber{background:var(--amber-bg);color:var(--amber)}
.empty-rows{padding:14px;color:var(--muted);font-size:13px}
.listtools{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.search{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;min-width:220px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin-bottom:22px}
.pcard{--pc:#888;background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--pc);border-radius:var(--radius);padding:12px 14px}
.pc-h{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.pc-h strong{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc-n{display:flex;gap:14px;font-size:12.5px;color:var(--muted);margin-bottom:10px;flex-wrap:wrap}
.pc-n b{color:var(--text);font-size:15px;margin-right:2px}
.pc-n .red b,.pc-n .red{color:var(--red)}
.prog{height:6px;border-radius:9px;background:var(--surface2);overflow:hidden;margin-bottom:5px}
.prog i{display:block;height:100%;background:var(--pc);border-radius:9px}
.sect{margin-bottom:22px}
.sect h2{font-size:15px;margin:0 0 8px;display:flex;align-items:center;gap:8px}
.sect h2 .count{font-size:12px;color:var(--muted);font-weight:500}
.sect.red h2{color:var(--red)}
.empty{max-width:640px;margin:40px auto;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px}
.empty h2{font-size:21px;margin-bottom:8px}
.empty ol{padding-left:20px;color:var(--muted);margin:18px 0 0}
.empty li{margin:6px 0}

/* ---------- Modal, Popover, Toast */
body.modal-open{overflow:hidden}
.modal-back{position:fixed;inset:0;z-index:60;background:rgba(10,12,16,.42);display:grid;place-items:start center;padding:6vh 16px 16px;overflow:auto}
.modal{width:100%;max-width:520px;background:var(--surface);border-radius:14px;box-shadow:var(--shadow);border:1px solid var(--line)}
.modal.wide{max-width:680px}
.mtop{display:flex;align-items:center;gap:8px;padding:14px 14px 4px 20px}
.mtop h2{font-size:17px;flex:1}
.mbody{padding:8px 20px 20px}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px;font-size:12.5px;color:var(--muted);font-weight:500;min-width:0}
.field input,.field select,.field textarea,.imptext{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:8px;padding:7px 9px;font-size:14px;width:100%;min-width:0}
.field textarea{resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.gridnr{display:grid;grid-template-columns:84px 1fr;gap:12px}
.seg{display:inline-flex;flex-wrap:wrap;gap:4px}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 10px;display:inline-flex;align-items:center;gap:6px;color:var(--text)}
.seg button[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 13%,var(--surface))}
.plats{display:flex;flex-wrap:wrap;gap:6px}
.plats label{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;border:1px solid var(--line);border-radius:8px;padding:5px 9px;color:var(--text);font-weight:400;cursor:pointer}
.mfoot{display:flex;align-items:center;gap:8px;margin-top:8px}
.mfoot .spacer{flex:1}
.note{font-size:13px;border-radius:9px;padding:9px 11px;margin-bottom:12px}
.note.amber{background:var(--amber-bg)} .note.red{background:var(--red-bg)}
.note ul{margin:6px 0 0;padding-left:18px} .note li{margin:2px 0}
.swatches{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.swatches button{width:26px;height:26px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line)}
.swatches button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--text)}
.swatches input[type=color]{width:34px;height:28px;border:1px solid var(--line);border-radius:7px;padding:1px;background:var(--surface)}
#pop{position:fixed;z-index:70;min-width:190px;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:5px}
#pop .mi{display:flex;align-items:center;gap:9px;width:100%;border:0;background:none;padding:7px 10px;border-radius:6px;text-align:left;color:var(--text);white-space:nowrap}
#pop .mi:hover{background:var(--surface2)}
#pop .mi .ok{margin-left:auto;color:var(--accent)}
#pop .mi.danger{color:var(--red)}
#pop hr{border:0;border-top:1px solid var(--line);margin:5px 4px}
#pop .mlabel{font-size:11px;color:var(--muted);padding:4px 10px 2px;text-transform:uppercase;letter-spacing:.05em}
#toast{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;transition:all .18s;z-index:80;background:var(--text);color:var(--bg);border-radius:10px;padding:9px 14px;display:flex;gap:14px;align-items:center;box-shadow:var(--shadow);max-width:calc(100vw - 32px);font-size:13.5px}
#toast.show{opacity:1;transform:translateX(-50%);pointer-events:auto}
#toast button{border:0;background:none;color:inherit;font-weight:700;text-decoration:underline;padding:0}
.dropzone{border:2px dashed var(--line);border-radius:12px;padding:18px;text-align:center;margin-bottom:12px}
.dropzone p{margin:4px 0}
body.file-over .dropzone{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,transparent)}
.imptext{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
.imphelp{margin-top:16px;padding-top:12px;border-top:1px solid var(--line);font-size:13px}
.pv{border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:4px}
.pv-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.dot{width:12px;height:12px;border-radius:50%;background:var(--pc);flex:none}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:8px;cursor:pointer}
.opt:has(input:checked){border-color:var(--accent);background:color-mix(in srgb,var(--accent) 7%,var(--surface))}
.opt input{margin-top:3px}
.opt .muted{font-size:12.5px}
.subopt{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;margin:8px 0 0 26px;color:var(--muted)}
fieldset{border:0;padding:0;margin:12px 0 0}
legend{padding:0;font-weight:600}
.daylist .rows{margin-bottom:12px}

/* ---------- Schmal (iPhone) */
.only-narrow{display:none}
@media (max-width:1080px){ .wide-only{display:none} .brand span{display:none} }
@media (max-width:760px){
  :root{--top:52px}
  .only-narrow{display:inline-grid}
  .hide-narrow{display:none!important}
  .brand{display:none}
  .topbar{gap:4px;padding-left:max(6px,env(safe-area-inset-left));padding-right:max(6px,env(safe-area-inset-right))}
  .tabs button{padding:5px 8px}
  .topbar .btn.primary{padding:6px 10px}
  .layout{grid-template-columns:minmax(0,1fr)}

<script type="text/plain" id="vorlage-prompt">
Exportiere den Social-Media-Plan aus diesem Chat als Importdatei für meinen Social-Media-Planer (eine Kalender-App).

AUSGABE
- Eine Datei namens <projekt-id>.plan.json zum Herunterladen.
- Wenn du keine Datei erzeugen kannst: genau ein JSON-Codeblock, ohne Text davor oder danach.

OBERSTE EBENE
- "format": immer "social-media-plan"
- "version": immer 1
- "projekt": Angaben zum Projekt (siehe PROJEKT)
- "exportiert_am": heutiges Datum als "JJJJ-MM-TT"
- "eintraege": Liste mit einem Eintrag pro Beitrag und pro To-do (siehe EINTRAG)

PROJEKT
- "id": feste Kennung, nur Kleinbuchstaben, Ziffern und Bindestriche, z. B. "baeckerei-mueller". Bei jedem späteren Export exakt gleich, sonst legt die App ein zweites Projekt an.
- "name": Anzeigename des Projekts.
- "kuerzel": 2 bis 3 Großbuchstaben. Steht im Kalender vor jeder Nummer, z. B. "BM".
- "farbe" (optional): Farbvorschlag als "#RRGGBB".

EINTRAG
- "id" (Pflicht): eindeutig im Projekt und dauerhaft, z. B. "bm-01" oder "bm-z1". Ein Eintrag behält seine id für immer, auch wenn sich Datum oder Titel ändern. Neue Einträge bekommen neue ids, alte ids nie wiederverwenden.
- "typ" (Pflicht): "post" für eine Veröffentlichung, "todo" für eine Aufgabe mit Fälligkeitsdatum (z. B. Fotos liefern, Freigabe geben).
- "nr" (Pflicht): Kennnummer im Kalender. Posts zweistellig "01", "02" …, To-dos "Z1", "Z2" …
- "titel" (Pflicht): kurz, höchstens etwa 60 Zeichen.
- "datum" (Pflicht): "JJJJ-MM-TT". Bei Posts der Veröffentlichungstag, bei To-dos der Tag, bis zu dem es erledigt sein muss. Wochentage prüfen.
- "uhrzeit" (optional): "HH:MM" im 24-Stunden-Format, nur bei fest geplanter Uhrzeit. Sonst weglassen.
- "plattform" (bei Posts Pflicht, bei To-dos weglassen): Liste aus "Instagram", "TikTok", "YouTube Shorts" (außerdem möglich: "Facebook", "LinkedIn"). Läuft derselbe Beitrag auf mehreren Plattformen: ein Eintrag mit mehreren Plattformen.
- "format" (optional): z. B. "Reel 20 s", "Karussell 7 Slides", "Story", "Short 30 s".
- "status" (optional, Standard "offen"): bei Posts "offen", "in_arbeit", "fertig" oder "gepostet"; bei To-dos "offen", "in_arbeit" oder "erledigt".
- "notiz" (optional): höchstens ein kurzer Satz.
- "link" (optional): Link zum veröffentlichten Beitrag.

REGELN
- Gültiges JSON: doppelte Anführungszeichen, keine Kommentare, kein Komma nach dem letzten Element einer Liste.
- Keine weiteren Felder. Captions, Hashtags und Skripte gehören nicht in diese Datei.
- Alle Einträge des Plans exportieren, auch bereits gepostete und erledigte, jeweils mit aktuellem Status.

function renderMonth() {

      const d = addDays(ws, i);

  }).join('');
  let h = cards ? `<div class="cards">${cards}</div>` : '';
  if (overdue.length) h += `<div class="sect red"><h2>Überfällig <span class="count">${overdue.length}</span></h2>${rowsHTML(overdue, true)}</div>`;
  h += `<div class="sect"><h2>Heute <span class="count">${fmtShort(TODAY)}</span></h2>${rowsHTML(today, false, 'Heute steht nichts an.')}</div>`;
  const map = byDate(next);
  h += `<div class="sect"><h2>Nächste 7 Tage <span class="count">${next.length}</span></h2>`;

  }
  view.innerHTML = h + '</div>';
}

// ================================================================ Modal, Popover, Toast
const modals = [];
function openModal(title, html, { wide = false, onClose } = {}) {
  const back = document.createElement('div');
  back.className = 'modal-back';
  back.innerHTML = `<div class="modal ${wide ? 'wide' : ''}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="mtop"><h2>${esc(title)}</h2><button class="iconbtn" data-close aria-label="Schließen">${ICON.x}</button></div><div class="mbody">${html}</div></div>`;
  let downOnBack = false;
  back.addEventListener('mousedown', ev => { downOnBack = ev.target === back; });
  back.addEventListener('click', ev => {
    if ((ev.target === back && downOnBack) || ev.target.closest('[data-close]')) closeModal(back);
  });
  document.body.appendChild(back);
  modals.push({ el: back, onClose });
  document.body.classList.add('modal-open');
  const af = back.querySelector('[autofocus]');
  if (af && !isNarrow()) af.focus();
  return back;
}
function closeModal(el) {
  const i = el ? modals.findIndex(m => m.el === el) : modals.length - 1;
  if (i < 0) return;
  const [m] = modals.splice(i, 1);
  m.el.remove();
  if (m.onClose) m.onClose();
  if (!modals.length) document.body.classList.remove('modal-open');
}
const closeAllModals = () => { while (modals.length) closeModal(); };

const pop = $('#pop');
let popPick = null, popAnchor = null;
function openPop(anchor, html, onPick) {
  pop.innerHTML = html;
  pop.hidden = false;

  let left = Math.min(r.left, innerWidth - w - 8), top = r.bottom + 4;
  if (top + h > innerHeight - 8) top = Math.max(8, r.top - h - 4);
  pop.style.left = Math.max(8, left) + 'px';
  pop.style.top = top + 'px';
  const first = pop.querySelector('button');
  if (first) first.focus({ preventScroll: true });
}
function closePop() { pop.hidden = true; popPick = null; }
pop.addEventListener('click', ev => {
  const b = elOf(ev).closest('button');
  if (!b) return;

  closePop();

});

// ================================================================ Import: Prüfen
function normDate(v) {
  const s = str(v);
  if (!s) return { ok: false, msg: 'fehlt' };
  const valid = (y, m, d) => { const t = new Date(y, m - 1, d); return t.getFullYear() === y && t.getMonth() === m - 1 && t.getDate() === d; };
  let m = /^(\d{4})-(\d{1,2})-(\d{1,2})(?:[T ](\d{1,2}):(\d{2}))?/.exec(s);
  if (m) {
    if (!valid(+m[1], +m[2], +m[3])) return { ok: false, msg: `"${s}" ist kein gültiges Datum` };
    return { ok: true, date: `${m[1]}-${pad(+m[2])}-${pad(+m[3])}`, time: m[4] ? `${pad(+m[4])}:${m[5]}` : '', warn: m[4] ? `Datum mit Uhrzeit "${s}" aufgeteilt` : '' };
  }
  m = /^(\d{1,2})\.(\d{1,2})\.(\d{4})$/.exec(s);
  if (m) {
    if (!valid(+m[3], +m[2], +m[1])) return { ok: false, msg: `"${s}" ist kein gültiges Datum` };
    return { ok: true, date: `${m[3]}-${pad(+m[2])}-${pad(+m[1])}`, time: '', warn: `Datum "${s}" in JJJJ-MM-TT umgewandelt` };
  }
  return { ok: false, msg: `"${s}" hat das falsche Format (erwartet JJJJ-MM-TT, z. B. 2026-10-13)` };
}
function normTime(v) {
  const s = str(v);
  if (!s) return { t: '' };
  let m = /^(\d{1,2})[:.](\d{2})(?:\s*Uhr)?$/i.exec(s);
  if (m && +m[1] < 24 && +m[2] < 60) return { t: `${pad(+m[1])}:${m[2]}` };
  m = /^(\d{1,2})\s*Uhr$/i.exec(s);
  if (m && +m[1] < 24) return { t: `${pad(+m[1])}:00`, warn: `Uhrzeit "${s}" als ${pad(+m[1])}:00 gelesen` };
  return { t: '', warn: `Uhrzeit "${s}" nicht lesbar (erwartet HH:MM), ignoriert` };
}
function normPlatform(p) {
  const k = str(p).toLowerCase().replace(/\s+/g, ' ');
  const map = { instagram: 'Instagram', insta: 'Instagram', ig: 'Instagram', tiktok: 'TikTok', 'tik tok': 'TikTok', tt: 'TikTok',
    youtube: 'YouTube Shorts', 'youtube shorts': 'YouTube Shorts', 'yt shorts': 'YouTube Shorts', shorts: 'YouTube Shorts', yt: 'YouTube Shorts',
    facebook: 'Facebook', fb: 'Facebook', linkedin: 'LinkedIn', pinterest: 'Pinterest' };
  return map[k] || str(p);
}
function normTyp(v) {
  const k = str(v).toLowerCase();
  if (!k) return { t: 'post', warn: '"typ" fehlt, als "post" gelesen' };
  if (['post', 'beitrag', 'posting', 'veröffentlichung'].includes(k)) return { t: 'post' };
  if (['todo', 'to-do', 'to do', 'aufgabe', 'task', 'zuarbeit'].includes(k)) return { t: 'todo', warn: k === 'todo' ? '' : `"typ" "${v}" als "todo" gelesen` };
  return { t: 'post', warn: `unbekannter "typ" "${v}", als "post" gelesen` };
}
function normStatus(v, typ) {
  const k = str(v).toLowerCase().replace(/[\s-]+/g, '_');
  if (!k) return { s: 'offen' };
  if (k === 'offen' || k === 'in_arbeit' || (typ === 'post' && (k === 'fertig' || k === 'gepostet')) || (typ === 'todo' && k === 'erledigt')) return { s: k };
  if (typ === 'todo' && (k === 'fertig' || k === 'gepostet' || k === 'done')) return { s: 'erledigt' };
  if (typ === 'post' && (k === 'erledigt' || k === 'veröffentlicht' || k === 'online' || k === 'posted')) return { s: 'gepostet', warn: `Status "${v}" als "gepostet" gelesen` };
  if (['geplant', 'todo', 'open', 'neu'].includes(k)) return { s: 'offen', warn: `Status "${v}" als "offen" gelesen` };
  if (['in_bearbeitung', 'in_progress', 'arbeit'].includes(k)) return { s: 'in_arbeit', warn: `Status "${v}" als "in_arbeit" gelesen` };
  if (k === 'bereit' || k === 'ready') return { s: typ === 'post' ? 'fertig' : 'erledigt', warn: `Status "${v}" als "${typ === 'post' ? 'fertig' : 'erledigt'}" gelesen` };
  return { s: 'offen', warn: `unbekannter Status "${v}", als "offen" gelesen` };
}

function validatePlan(raw) {
  const E = [], W = [];
  if (!raw || typeof raw !== 'object' || Array.isArray(raw)) return { errors: ['Die Datei enthält kein Plan-Objekt { … }.'], warnings: [] };
  if (raw.format !== 'social-media-plan') W.push(raw.format ? `Unbekanntes "format": "${raw.format}" (erwartet "social-media-plan"). Ich versuche es trotzdem.` : 'Feld "format" fehlt (erwartet "social-media-plan").');
  if (raw.version !== undefined && raw.version !== 1) W.push(`"version" ist ${raw.version}, die App kennt Version 1.`);
  const pr = raw.projekt && typeof raw.projekt === 'object' ? raw.projekt : null;
  if (!pr) E.push('Feld "projekt" fehlt (mit "id", "name" und "kuerzel").');
  let pid = str(pr && pr.id), name = str(pr && pr.name), kz = str(pr && pr.kuerzel), farbe = str(pr && pr.farbe);
  if (pr && !name && !pid) E.push('"projekt.name" und "projekt.id" fehlen.');
  if (!name && pid) { name = pid; W.push('"projekt.name" fehlt, die ID wird als Name verwendet.'); }
  if (!pid && name) { pid = slugify(name); W.push(`"projekt.id" fehlt, verwendet wird "${pid}". Beim nächsten Export muss dieselbe ID drinstehen.`); }
  else if (pid && !/^[a-z0-9][a-z0-9-]*$/.test(pid)) { const s = slugify(pid) || 'projekt'; W.push(`"projekt.id" "${pid}" enthält unerlaubte Zeichen, verwendet wird "${s}".`); pid = s; }
  if (!kz) kz = abbr(name);
  if (kz.length > 4) W.push(`"kuerzel" "${kz}" ist zu lang, gekürzt auf "${kz.slice(0, 4).toUpperCase()}".`);
  kz = kz.toUpperCase().slice(0, 4);
  if (farbe && !hexToRgb(farbe)) { W.push(`"projekt.farbe" "${farbe}" ist kein Farbwert wie "#29AEB1" und wird ignoriert.`); farbe = ''; }
  const list = raw.eintraege;
  if (!Array.isArray(list)) { E.push('Feld "eintraege" fehlt oder ist keine Liste [ … ].'); return { errors: E, warnings: W }; }
  if (!list.length) E.push('"eintraege" ist leer.');
  const ids = new Set(), out = [];
  list.forEach((r, n) => {
    const where = `Eintrag ${n + 1}${r && r.id != null && r.id !== '' ? ` (id "${r.id}")` : ''}`;
    if (!r || typeof r !== 'object' || Array.isArray(r)) { E.push(`${where}: ist kein Objekt { … }.`); return; }
    const id = str(r.id);
    if (!id) { E.push(`${where}: "id" fehlt.`); return; }
    if (ids.has(id)) { E.push(`${where}: "id" "${id}" kommt doppelt vor.`); return; }
    ids.add(id);
    const ty = normTyp(r.typ); if (ty.warn) W.push(`${where}: ${ty.warn}.`);
    const titel = str(r.titel); if (!titel) E.push(`${where}: "titel" fehlt.`);
    const dt = normDate(r.datum);
    if (!dt.ok) E.push(`${where}: "datum" ${dt.msg}.`); else if (dt.warn) W.push(`${where}: ${dt.warn}.`);
    const tm = normTime(r.uhrzeit !== undefined && r.uhrzeit !== null && r.uhrzeit !== '' ? r.uhrzeit : (dt.time || ''));
    if (tm.warn) W.push(`${where}: ${tm.warn}.`);
    let pl = Array.isArray(r.plattform) ? r.plattform : (str(r.plattform) ? str(r.plattform).split(/\s*[,;/+]\s*/) : []);
    pl = [...new Set(pl.map(normPlatform).filter(Boolean))];
    if (ty.t === 'post' && !pl.length) W.push(`${where}: keine "plattform" angegeben.`);
    if (ty.t === 'todo') pl = [];
    const stt = normStatus(r.status, ty.t); if (stt.warn) W.push(`${where}: ${stt.warn}.`);
    const nr = str(r.nr); if (!nr) W.push(`${where}: "nr" fehlt.`);
    out.push({ id, typ: ty.t, nr, titel, datum: dt.ok ? dt.date : '', uhrzeit: tm.t, plattform: pl, format: str(r.format), status: stt.s, notiz: str(r.notiz), link: str(r.link) });
  });
  return { plan: { projekt: { id: pid, name, kuerzel: kz, farbe }, exportiert_am: str(raw.exportiert_am), eintraege: out }, errors: E, warnings: W };
}

function parseJSONText(text) {
  let s = String(text || '').replace(/^﻿/, '').trim();
  const fence = /```[a-zA-Z]*\s*([\s\S]*?)```/.exec(s);
  if (fence) s = fence[1].trim();
  if (!/^[[{]/.test(s)) { const i = s.search(/[[{]/); if (i >= 0) s = s.slice(i); }
  const lastClose = Math.max(s.lastIndexOf('}'), s.lastIndexOf(']'));
  if (lastClose >= 0) s = s.slice(0, lastClose + 1);
  if (!s) return { ok: false, msg: 'Kein Inhalt gefunden.' };
  try { return { ok: true, data: JSON.parse(s) }; } catch (err) {
    const fixed = s.replace(/[“”„]/g, '"').replace(/,(\s*[}\]])/g, '$1');
    try { return { ok: true, data: JSON.parse(fixed), warn: 'Kleine JSON-Fehler (überzählige Kommas oder typografische Anführungszeichen) automatisch korrigiert.' }; } catch (err2) {}
    return { ok: false, msg: `Kein gültiges JSON (${err.message}). Häufige Ursachen: Komma nach dem letzten Element, Kommentare, einfache Anführungszeichen oder eine abgeschnittene Antwort.` };
  }
}

// ================================================================ Import: Zusammenführen
function srcOf(i) { const s = {}; for (const f of SYNC_FIELDS) s[f] = clone(i[f]); s.status = i.status; return s; }
function newEntry(pid, i) {
  const e = { uid: uidOf(pid, i.id), projekt: pid, id: i.id };
  for (const f of SYNC_FIELDS) e[f] = clone(i[f]);
  e.status = i.status;
  e.src = srcOf(i);
  return e;
}
function fixStatusForTyp(s, typ) {
  if (typ === 'todo' && (s === 'fertig' || s === 'gepostet')) return 'erledigt';
  if (typ === 'post' && s === 'erledigt') return 'gepostet';
  return s;
}
// Dreiwege-Abgleich: Hat der neue Plan ein Feld gegenüber dem letzten Import geändert, gewinnt der Plan.
// Sonst bleibt deine lokale Änderung (Verschieben, Notiz …). Beim Status gilt der weiter fortgeschrittene.
function mergePlan(pid, plan, deleteMissing) {
  const existing = state.entries.filter(e => e.projekt === pid);
  const byId = new Map(existing.map(e => [e.id, e]));
  const seen = new Set(), out = [];
  const st = { neu: 0, geaendert: 0, gleich: 0, fehlt: 0, lokal: 0 };
  for (const i of plan.eintraege) {
    seen.add(i.id);
    const old = byId.get(i.id);
    if (!old) { out.push(newEntry(pid, i)); st.neu++; continue; }
    const e = clone(old), base = old.src || {};
    let changed = false;
    for (const f of SYNC_FIELDS) {
      if (!same(i[f], base[f]) && !same(i[f], e[f])) { e[f] = clone(i[f]); changed = true; }
    }
    let s = fixStatusForTyp(e.status, e.typ);
    const is = fixStatusForTyp(i.status, e.typ);
    if (RANK[is] > RANK[s]) s = is;
    if (s !== e.status) { e.status = s; changed = true; }
    if (e.entfernt) { delete e.entfernt; changed = true; }
    e.src = srcOf(i);
    if (changed) st.geaendert++; else st.gleich++;
    out.push(e);
  }
  for (const e of existing) {
    if (seen.has(e.id)) continue;
    if (e.lokal) { out.push(e); st.lokal++; continue; }
    st.fehlt++;
    if (!deleteMissing) { const c = clone(e); c.entfernt = true; out.push(c); }
  }
  return { entries: out, stats: st };
}
function applyImport(plan, mode, deleteMissing) {
  const P = plan.projekt;
  let proj = projById(P.id);
  let fresh = false;
  if (!proj || mode === 'new') {
    const id = proj ? uniqueProjId(P.id) : P.id;
    let name = P.name;
    if (proj) { let n = 2; while (state.projects.some(x => x.name === `${P.name} (${n})`)) n++; name = `${P.name} (${n})`; }
    proj = { id, name, kuerzel: P.kuerzel, farbe: pickColor(P.farbe), sichtbar: true, src: { name: P.name, kuerzel: P.kuerzel } };
    state.projects.push(proj);
    fresh = true;
  } else {
    const src = proj.src || {};
    if (P.name !== src.name && P.name !== proj.name) proj.name = P.name;
    if (P.kuerzel !== src.kuerzel && P.kuerzel !== proj.kuerzel) proj.kuerzel = P.kuerzel;
    proj.src = { name: P.name, kuerzel: P.kuerzel };
  }
  proj.importiert_am = new Date().toISOString();
  const list = (fresh || mode === 'replace') ? plan.eintraege.map(i => newEntry(proj.id, i)) : mergePlan(proj.id, plan, deleteMissing).entries;
  state.entries = state.entries.filter(e => e.projekt !== proj.id).concat(list);
  return proj;
}

    const [y, m, d] = e.datum.split('-').map(Number);
    if (alarm === 'vortag') alarmAt = new Date(y, m - 1, d - 1, 9, 0);
    else if (alarm === 'tag') alarmAt = h >= 10 ? new Date(y, m - 1, d, 9, 0) : new Date(y, m - 1, d, h - 1, mi);
  } else {
    L.push(`DTSTART;VALUE=DATE:${icsDay(e.datum)}`, `DTEND;VALUE=DATE:${icsDay(addDays(e.datum, 1))}`);
    const [y, m, d] = e.datum.split('-').map(Number);
    if (alarm === 'vortag') alarmAt = new Date(y, m - 1, d - 1, 9, 0);
    else if (alarm === 'tag') alarmAt = new Date(y, m - 1, d, 9, 0);
  }
  const desc = [p.name ? `Projekt: ${p.name}` : '', e.typ === 'post' && e.plattform.length ? `Plattform: ${e.plattform.join(', ')}` : '',
    e.format ? `Format: ${e.format}` : '', `Status beim Übertragen: ${statusLabel(e.typ, e.status)}`, e.notiz ? `Notiz: ${e.notiz}` : '', e.link ? `Link: ${e.link}` : ''].filter(Boolean).join('\n');
  L.push(`SUMMARY:${icsEsc(icsSummary(e))}`, `DESCRIPTION:${icsEsc(desc)}`, 'TRANSP:TRANSPARENT');
  if (p.name) L.push(`CATEGORIES:${icsEsc(p.name)}`);
  if (/^https?:\/\/\S+$/.test(e.link || '')) L.push(`URL:${e.link}`);
  if (alarmAt) L.push('BEGIN:VALARM', 'ACTION:DISPLAY', `DESCRIPTION:${icsEsc(icsSummary(e))}`, `TRIGGER;VALUE=DATE-TIME:${icsUtc(alarmAt)}`, 'END:VALARM');
  L.push('END:VEVENT');
  return L;
}
function buildIcs(list, alarm) {
  const stamp = icsUtc(new Date());
  const L = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Social-Media-Planer//DE', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH', 'X-WR-CALNAME:Social Media', 'X-WR-TIMEZONE:Europe/Berlin'];
  if (list.some(e => e.uhrzeit)) L.push(...VTZ_BERLIN);
  for (const e of list) L.push(...icsEvent(e, alarm, stamp));
  L.push('END:VCALENDAR');
  return L.map(icsFold).join('\r\n') + '\r\n';
}
function openIcs(pid) {
  closeAllModals();
  if (!state.projects.length) { toast('Noch keine Projekte. Importiere zuerst einen Plan.'); return; }
  const st = state.settings;
  const cfg = Object.assign({ zeitraum: 'ab_heute', ohneErledigt: true, alarm: 'keine', posts: true, todos: true, modus: 'alles' }, st.ics || {});
  const sel = new Set(pid ? [pid] : state.projects.filter(p => p.sichtbar !== false).map(p => p.id));
  if (!sel.size) state.projects.forEach(p => sel.add(p.id));
  const sentAny = Object.keys(st.icsSent).length > 0;
  cfg.modus = sentAny ? 'neu' : 'alles';  // nach der ersten Übertragung "Nur Neues" vorschlagen, sonst entstehen Doppelte
  const radio = (name, val, label, sub) => `<label class="opt"><input type="radio" name="${name}" value="${val}" ${cfg[name] === val ? 'checked' : ''}><span><strong>${label}</strong>${sub ? `<br><span class="muted">${sub}</span>` : ''}</span></label>`;
  const html = `<form id="icsForm">
    <div class="field">Projekte<div class="plats">${state.projects.map(p => `<label><input type="checkbox" name="proj" value="${esc(p.id)}" ${sel.has(p.id) ? 'checked' : ''} style="accent-color:${p.farbe}"> ${esc(p.name)}</label>`).join('')}</div></div>
    <div class="field">Was<div class="plats"><label><input type="checkbox" name="posts" ${cfg.posts ? 'checked' : ''}> Posts</label><label><input type="checkbox" name="todos" ${cfg.todos ? 'checked' : ''}> To-dos</label><label><input type="checkbox" name="ohneErledigt" ${cfg.ohneErledigt ? 'checked' : ''}> Gepostetes und Erledigtes weglassen</label></div></div>
    <div class="grid2">
      <label class="field">Zeitraum<select name="zeitraum"><option value="ab_heute" ${cfg.zeitraum === 'ab_heute' ? 'selected' : ''}>ab heute (und Überfälliges)</option><option value="alles" ${cfg.zeitraum === 'alles' ? 'selected' : ''}>alles</option></select></label>
      <label class="field">Erinnerung im Kalender<select name="alarm">${ALARMS.map(([k, l]) => `<option value="${k}" ${cfg.alarm === k ? 'selected' : ''}>${l}</option>`).join('')}</select></label>
    </div>
    <fieldset style="margin-top:0"><legend class="small muted" style="font-weight:500">Übertragen</legend>
      ${radio('modus', 'alles', 'Alles', 'Für den ersten Import oder in einen vorher geleerten Kalender.')}
      ${sentAny ? radio('modus', 'neu', 'Nur Neues seit der letzten Übertragung', `Zuletzt übertragen: ${fmtStamp(st.icsLast)}. Bereits übertragene Termine kommen nicht noch einmal.`) : ''}
    </fieldset>
    <div id="icsInfo" style="margin-top:12px"></div>
    <details class="note" style="background:var(--surface2)" ${st.icsLast ? '' : 'open'}><summary><strong>So kommt es in Apple Kalender</strong></summary><ol style="margin:8px 0 0;padding-left:18px">
      <li>Einmalig: in der Kalender-App <em>Ablage → Neuer Kalender</em> einen Kalender „Social Media“ anlegen, am besten unter iCloud, dann siehst du die Termine auch auf dem iPhone.</li>
      <li>Hier auf <em>Kalenderdatei erstellen</em> klicken und die Datei aus „Downloads“ öffnen (Doppelklick).</li>
      <li>Kalender fragt, wohin die Termine sollen: „Social Media“ wählen.</li></ol>
      <p style="margin:8px 0 0"><strong>Aktualisieren:</strong> Apple Kalender erkennt schon übertragene Termine nicht wieder und legt sie sonst doppelt an. Entweder „Nur Neues“ wählen, oder den Kalender „Social Media“ löschen, neu anlegen und „Alles“ übertragen.</p></details>
    <div class="mfoot"><span class="spacer"></span><button type="button" class="btn" data-close>Abbrechen</button><button type="submit" class="btn primary" id="icsGo">Kalenderdatei erstellen</button></div>
  </form>`;
  const m = openModal('In Apple Kalender übertragen', html, { wide: true });
  const f = $('#icsForm', m);
  const read = () => ({
    posts: f.posts.checked, todos: f.todos.checked, ohneErledigt: f.ohneErledigt.checked, zeitraum: f.zeitraum.value, alarm: f.alarm.value,
    modus: ($('input[name=modus]:checked', f) || {}).value || 'alles',
  });
  const plan = () => {
    const c = read();
    const chosen = new Set($$('input[name=proj]:checked', f).map(x => x.value));
    const all = icsSelect(c, chosen);
    const list = c.modus === 'neu' ? all.filter(e => !st.icsSent[e.uid]) : all;
    const changed = c.modus === 'neu' ? all.filter(e => st.icsSent[e.uid] && st.icsSent[e.uid] !== icsSig(e)) : [];
    return { c, list, changed };
  };
  const update = () => {
    const { list, changed } = plan();
    const posts = list.filter(e => e.typ === 'post').length;
    $('#icsInfo', m).innerHTML = (list.length
      ? `<p style="margin:0 0 8px"><strong>${plural(list.length, 'Termin', 'Termine')}</strong> (${plural(posts, 'Post', 'Posts')}, ${plural(list.length - posts, 'To-do', 'To-dos')})${list.length ? ` · ${fmtDate(list[0].datum)} bis ${fmtDate(list[list.length - 1].datum)}` : ''}</p>`
      : `<p class="muted" style="margin:0 0 8px">${read().modus === 'neu' ? 'Nichts Neues seit der letzten Übertragung.' : 'Keine Termine für diese Auswahl.'}</p>`)
      + (changed.length ? `<div class="note amber">${plural(changed.length, 'bereits übertragener Termin hat', 'bereits übertragene Termine haben')} sich seitdem geändert (Datum, Uhrzeit oder Titel), z. B. „${esc(entryLabel(changed[0]))}“. Die alten Termine bleiben im Kalender stehen. Für einen sauberen Stand den Kalender leeren und „Alles“ übertragen.</div>` : '');
    $('#icsGo', m).disabled = !list.length;
    $('#icsGo', m).textContent = list.length ? `Kalenderdatei erstellen (${list.length})` : 'Kalenderdatei erstellen';
  };
  f.addEventListener('change', update);
  update();
  f.addEventListener('submit', ev => {
    ev.preventDefault();
    const { c, list } = plan();
    if (!list.length) return;
    download(`social-media-kalender-${TODAY}.ics`, buildIcs(list, c.alarm), 'text/calendar');
    if (c.modus === 'alles') st.icsSent = {};
    for (const e of list) st.icsSent[e.uid] = icsSig(e);
    st.ics = { posts: c.posts, todos: c.todos, ohneErledigt: c.ohneErledigt, zeitraum: c.zeitraum, alarm: c.alarm };
    st.icsLast = new Date().toISOString();
    persist();
    closeModal(m);
    renderSide();
    toast(`${plural(list.length, 'Termin', 'Termine')} als Kalenderdatei gespeichert. In „Downloads“ öffnen und „Social Media“ wählen.`);
  });
}

const exampleText = () => $('#vorlage-beispiel').textContent.trim() + '\n';
const promptText = () => $('#vorlage-prompt').textContent.trim() + '\n';
function copyText(text, okMsg) {
  const fallback = () => {
    const ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (err) {}
    ta.remove();
    if (ok) toast(okMsg);
    else openModal('Zum Kopieren', `<p class="small muted" style="margin-top:0">Automatisches Kopieren ging nicht. Text markieren (⌘A) und kopieren (⌘C):</p><textarea class="imptext" rows="14" style="width:100%" readonly>${esc(text)}</textarea>`, { wide: true });
  };
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(() => toast(okMsg), fallback);
  else fallback();
}

// ================================================================ Aktionen und Ereignisse
const elOf = ev => (ev.target && ev.target.nodeType === 1 ? ev.target : (ev.target && ev.target.parentElement) || document.body);
function setView(v) { ui.view = v; state.settings.view = v; persist(); vbar.innerHTML = ''; render(); window.scrollTo(0, 0); }
function step(dir) {
  if (ui.view === 'monat') ui.cursor = addMonths(ui.cursor, dir);
  else if (ui.view === 'woche') ui.cursor = addDays(ui.cursor, 7 * dir);
  else return;
  render();
}
function action(a, el) {
  switch (a) {
    case 'new': openEditor(null, { datum: el && el.dataset.date }); break;
    case 'import': openImport(); break;
    case 'menu': openMainMenu(el); break;
    case 'toggle-side': document.body.classList.toggle('side-open'); break;
    case 'prev': step(-1); break;
    case 'next': step(1); break;
    case 'today': ui.cursor = TODAY; render(); break;
    case 'day': openDay(el.dataset.date); break;
    case 'proj-edit': document.body.classList.remove('side-open'); openProject(el.dataset.pid); break;
    case 'proj-new': document.body.classList.remove('side-open'); openProject(null); break;
    case 'backup-save': backupSave(); break;
    case 'backup-load': backupLoad(); break;
    case 'backup-later': ui.backupLater = true; renderBanners(); break;
    case 'copy-prompt': copyText(promptText(), 'Prompt kopiert. Im Chat des Projekts einfügen.'); break;
    case 'ics': document.body.classList.remove('side-open'); openIcs(); break;
    case 'example-download': download('beispiel-plan.json', exampleText()); break;
    case 'example-load': openImport(exampleText()); break;
    case 'undo': $('#toast').classList.remove('show'); undo(); break;
    case 'wipe':
      if (confirm('Wirklich alle Projekte und Einträge in diesem Browser löschen?\n\nTipp: Vorher „Backup sichern“.')) mutate('Alle Daten gelöscht', () => { state.projects = []; state.entries = []; });
      break;
  }
}

document.addEventListener('click', ev => {
  const t = elOf(ev);
  if (t.closest('#pop')) return;
  if (!pop.hidden) {
    closePop();
    const anchor = t.closest('[data-action]');
    if (anchor && anchor === popAnchor) { popAnchor = null; return; }  // gleicher Knopf: Menü nur schließen
  }
  const st = t.closest('[data-action="status"]');
  if (st && !(isNarrow() && st.closest('.month'))) { popAnchor = st; openStatusMenu(st, st.closest('[data-uid]').dataset.uid); return; }
  const a = t.closest('[data-action]');
  if (a && a.dataset.action !== 'status') { if (a.dataset.action === 'menu') popAnchor = a; action(a.dataset.action, a); return; }
  const v = t.closest('[data-view]');
  if (v) { setView(v.dataset.view); return; }
  if (t.closest('.modal') && !t.closest('.daylist')) return;
  const day = t.closest('.month .day[data-date]');
  if (day && isNarrow()) { openDay(day.dataset.date); return; }
  const item = t.closest('[data-uid]');
  if (item) openEditor(item.dataset.uid);
});
document.addEventListener('dblclick', ev => {
  const t = elOf(ev);
  if (isNarrow() || t.closest('[data-uid],button')) return;
  const cell = t.closest('.day[data-date],.wcol[data-date]');
  if (cell) openEditor(null, { datum: cell.dataset.date });
});
document.addEventListener('change', ev => {
  const t = ev.target;
  if (t.dataset.projToggle) { const p = projById(t.dataset.projToggle); if (p) { p.sichtbar = t.checked; persist(); render(); } }
  else if (t.dataset.filter) { state.settings[t.dataset.filter] = t.checked; persist(); render(); }
  else if (t.id === 'listPast') { ui.showPast = t.checked; renderListBody(); }
});
document.addEventListener('input', ev => { if (ev.target.id === 'listSearch') { ui.search = ev.target.value; renderListBody(); } });
document.addEventListener('keydown', ev => {
  const typing = elOf(ev).closest('input,textarea,select,[contenteditable]');
  if (ev.key === 'Escape') {
    if (!pop.hidden) { closePop(); return; }
    if (modals.length) { closeModal(); return; }
    document.body.classList.remove('side-open');
    return;
  }
  if ((ev.metaKey || ev.ctrlKey) && ev.key.toLowerCase() === 'z' && !ev.shiftKey && !typing && !modals.length) { ev.preventDefault(); undo(); return; }
  if (typing || ev.metaKey || ev.ctrlKey || ev.altKey) return;
  if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.matches && ev.target.matches('[data-action="status"]')) { ev.preventDefault(); ev.target.click(); return; }
  if (ev.key === 'Enter' && ev.target.matches && ev.target.matches('[data-uid]')) { openEditor(ev.target.dataset.uid); return; }
  if (modals.length) return;
  if (ev.key === 'ArrowLeft') step(-1);
  else if (ev.key === 'ArrowRight') step(1);
  else if (ev.key === 't' || ev.key === 'T') { ui.cursor = TODAY; render(); }
  else if (ev.key === 'n' || ev.key === 'N') { ev.preventDefault(); openEditor(null); }
  else if (['1', '2', '3', '4'].includes(ev.key)) setView(['heute', 'monat', 'woche', 'liste'][+ev.key - 1]);
});
document.addEventListener('paste', ev => {
  if (elOf(ev).closest('input,textarea')) return;
  const text = (ev.clipboardData || window.clipboardData).getData('text');
  if (/^\s*(```|[[{])/.test(text || '')) { ev.preventDefault(); openImport(text); }
});

// Drag & Drop: Einträge verschieben
let dragUid = null, overEl = null;
const clearOver = () => { if (overEl) overEl.classList.remove('drop-over'); overEl = null; };
document.addEventListener('dragstart', ev => {
  const c = elOf(ev).closest('.chip[data-uid]');
  if (!c) return;
  dragUid = c.dataset.uid;
  ev.dataTransfer.effectAllowed = 'move';
  ev.dataTransfer.setData('text/plain', 'smp:' + dragUid);
  c.classList.add('dragging');
});
document.addEventListener('dragend', ev => { const c = elOf(ev).closest('.chip'); if (c) c.classList.remove('dragging'); dragUid = null; clearOver(); });
document.addEventListener('dragover', ev => {
  const types = [...(ev.dataTransfer ? ev.dataTransfer.types : [])];
  if (types.includes('Files')) { ev.preventDefault(); document.body.classList.add('file-over'); return; }
  if (!dragUid) return;
  const cell = elOf(ev).closest('[data-drop]');
  if (!cell) { clearOver(); return; }
  ev.preventDefault();
  ev.dataTransfer.dropEffect = 'move';
  if (cell !== overEl) { clearOver(); overEl = cell; cell.classList.add('drop-over'); }
});
document.addEventListener('dragleave', ev => { if (!ev.relatedTarget) document.body.classList.remove('file-over'); });
document.addEventListener('drop', ev => {
  const types = [...(ev.dataTransfer ? ev.dataTransfer.types : [])];
  document.body.classList.remove('file-over');
  if (types.includes('Files')) { ev.preventDefault(); if (ev.dataTransfer.files.length) openImport(null, ev.dataTransfer.files); return; }
  const cell = elOf(ev).closest('[data-drop]');
  const uid = dragUid;
  clearOver();
  if (!cell || !uid) return;
  ev.preventDefault();
  const e = entryByUid(uid), d = cell.dataset.drop;
  if (e && e.datum !== d) mutate(`Verschoben auf ${fmtShort(d)}`, () => { e.datum = d; });
});

// Datum wechselt (App bleibt über Nacht offen)
const refreshDay = () => { const t = todayISO(); if (t !== TODAY) { TODAY = t; render(); } };
setInterval(refreshDay, 60000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) refreshDay(); });
matchMedia('(max-width: 760px)').addEventListener('change', () => render());

// Online (GitHub Pages): Manifest und Offline-Cache für den Home-Bildschirm
if (/^https?:$/.test(location.protocol)) {
  const l = document.createElement('link'); l.rel = 'manifest'; l.href = 'manifest.webmanifest'; document.head.appendChild(l);
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
}

window.__smp = { state: () => state, validatePlan, mergePlan, holidays, parseJSONText, buildIcs };
render();
})();
</script>
